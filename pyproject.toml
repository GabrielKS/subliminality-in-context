[project]
name = "subliminality-in-context"
version = "0.1.0"
description = "Research code for studying subliminal learning-like effects in context."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "einops>=0.8.2",
    "hf>=1.18.0",
    "huggingface-hub>=1.18.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.58.0",
    "torch>=2.12.0",
    "tqdm>=4.68.1",
    "transformers>=5.10.2",
    "wandb>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subliminality"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
    "jupyter>=1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
